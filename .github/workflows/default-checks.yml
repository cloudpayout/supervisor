# specs/003-record-test-results/spec.md
name: Default checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: default-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  default-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@v4

      - name: Install Go from go.mod
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget ca-certificates
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb
          command -v google-chrome

      - name: Run the default checks once
        run: |
          set -o pipefail
          go test -json ./... | tee test-results.json
          status=${PIPESTATUS[0]}
          if grep -q '"Action":"skip"' test-results.json; then
            echo "A check was skipped"
            exit 1
          fi
          exit "$status"